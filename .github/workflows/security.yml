name: Security scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "13 5 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==1.185.0"
      - name: Run Semgrep
        env:
          SEMGREP_SEND_METRICS: "off"
        run: semgrep scan --config p/default --sarif --output semgrep.sarif .
      - name: Upload Semgrep results
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]')) }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Summarize semgrep findings when SARIF upload is unavailable
        if: ${{ always() && hashFiles('semgrep.sarif') != '' && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]') }}
        env:
          SARIF_FILE: semgrep.sarif
        run: |
          jq -r '[.runs[].results[]?] | if length == 0 then "No findings reported." else .[] | "Finding: \(.ruleId // "unknown") at \([.locations[]?.physicalLocation? | select(.artifactLocation.uri != null) | "\(.artifactLocation.uri):\(.region.startLine // 1)"] | join(", "))" end' "$SARIF_FILE"
  mobsfscan:
    name: MobSF source scan (ios)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install mobsfscan
        run: python -m pip install --disable-pip-version-check "mobsfscan==1.1.0"
      - name: Run mobsfscan
        run: mobsfscan . --type ios --sarif --output mobsfscan.sarif
      - name: Upload MobSF results
        if: ${{ !cancelled() && hashFiles('mobsfscan.sarif') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]')) }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: mobsfscan.sarif
          category: mobsfscan-ios
      - name: Summarize mobsfscan-ios findings when SARIF upload is unavailable
        if: ${{ always() && hashFiles('mobsfscan.sarif') != '' && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]') }}
        env:
          SARIF_FILE: mobsfscan.sarif
        run: |
          jq -r '[.runs[].results[]?] | if length == 0 then "No findings reported." else .[] | "Finding: \(.ruleId // "unknown") at \([.locations[]?.physicalLocation? | select(.artifactLocation.uri != null) | "\(.artifactLocation.uri):\(.region.startLine // 1)"] | join(", "))" end' "$SARIF_FILE"
